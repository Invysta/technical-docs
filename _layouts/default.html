<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f7f9fb;
      color: #1a2332;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #006f5e;
      padding: 48px 0 40px;
    }
    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 40px;
    }
    .header-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    header p {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      max-width: 540px;
    }

    /* ── Main content ── */
    main {
      flex: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 40px;
      width: 100%;
    }

    /* ── Content from index.md ── */
    main h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #006f5e;
      margin-bottom: 24px;
      padding-bottom: 10px;
      border-bottom: 2px solid #006f5e;
    }

    main p {
      color: #3a4a5c;
      margin-bottom: 16px;
      font-size: 15px;
    }

    main hr {
      border: none;
      border-top: 1px solid #dde5ed;
      margin: 28px 0;
    }

    main h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    main h3 a {
      color: #0055cc;
      text-decoration: none;
    }
    main h3 a:hover {
      color: #006f5e;
      text-decoration: underline;
    }

    main em {
      color: #5a6e82;
      font-size: 14px;
    }

    main em a {
      color: #006f5e;
    }

    /* ── Footer ── */
    footer {
      background: #e8eef3;
      border-top: 1px solid #c8d6e0;
      padding: 20px 40px;
      text-align: center;
      font-size: 13px;
      color: #5a6e82;
    }
    footer a {
      color: #006f5e;
      text-decoration: none;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header-inner, main { padding: 32px 20px; }
      header h1 { font-size: 24px; }
      footer { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-label">Invysta Technology Group</div>
      <h1>{{ site.title }}</h1>
      {% if site.description %}<p>{{ site.description }}</p>{% endif %}
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    &copy; {{ "now" | date: "%Y" }} Invysta Technology Group. All rights reserved.
  </footer>

</body>
</html>
